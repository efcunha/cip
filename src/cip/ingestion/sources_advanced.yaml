# ─────────────────────────────────────────────────────────────────────────
# Round 22+: Real-world case studies (postmortems, lessons learned)
# Carregado como pseudo-cloud "case-studies" — usado pelo forum_fetcher para
# complementar URLs estáticas com postmortems descobertos em HN/dev.to/Reddit.
# ─────────────────────────────────────────────────────────────────────────
case-studies:
  - source: aws-postmortems
    service: postmortems
    category: case-studies
    doc_type: postmortem
    urls:
      - https://aws.amazon.com/message/12721/  # Kinesis event storm
      - https://aws.amazon.com/message/64894/  # us-east-1 Dec 7 2021
      - https://aws.amazon.com/message/12727/  # us-east-1 Oct 22 2021
    # Round 22.4: o postmortem S3 US-EAST-1 2017 (message/02719 -> 41926) é
    # curado localmente e registrado sob o pseudo-cloud "aws" (ver mvp.aws),
    # porque o router mapeia "S3" -> aws e o especialista aws filtra retrieval
    # por cloud=aws. Mantê-lo também aqui sob cloud=case-studies criava chunks
    # duplicados (mesmo content_hash) que o dedupe descartava.
  - source: google-cloud-incidents
    service: postmortems
    category: case-studies
    doc_type: postmortem
    urls:
      - https://status.cloud.google.com/summary
      - https://cloud.google.com/blog/topics/inside-google-cloud
  - source: netflix-tech-blog
    service: case-studies
    category: case-studies
    doc_type: engineering-blog
    # Round 22.4: netflixtechblog.com (Medium) bloqueia o fetcher via Cloudflare
    # (paginas "you have been blocked"). Conteúdo factual curado localmente
    # (schema evolution, backpressure, idempotency, streaming), citando as URLs
    # oficiais da Netflix como provenance.
    urls: []
    local_files:
      - path: db/curated/netflix-spark-kafka.md
        url: https://netflixtechblog.com/2018/12/12/netflix-spark-and-kafka/
  - source: linkedin-engineering

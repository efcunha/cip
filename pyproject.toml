[project]
name = "cloud-intelligence-platform"
version = "0.2.0+integration"
description = "LLM especialista em AWS, GCP e Azure atuando como engenheiro de cloud sênior (RAG + tools read-only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # RAG / orquestração
    "llama-index-core>=0.12",
    "llama-index-vector-stores-postgres>=0.3",
    "llama-index-embeddings-huggingface>=0.4",
    "llama-index-llms-bedrock>=0.3",
    "llama-index-llms-openai-like>=0.3",
    "llama-index-readers-web>=0.3",
    # Banco
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    # Ingestão
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "markdownify>=0.13",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    # Cloud SDKs (tools read-only)
    "boto3>=1.34",
    "azure-identity>=1.17",
    "azure-mgmt-advisor>=9.0",
    "azure-mgmt-costmanagement>=4.0",
    "azure-mgmt-compute>=32.0",
    "google-cloud-recommender>=2.15",
    "google-cloud-asset>=3.26",
    # Inspection Engine
    "python-hcl2>=4.3",
    "kubernetes>=30.1",
    # Observabilidade
    "structlog>=24.1",
    # Auth (Round 22+ Phase 2)
    "python-jose[cryptography]>=3.3",
    # Métricas (Round 22+ Phase 2)
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "black>=24.4",
]

[project.scripts]
cip-ingest = "cip.ingestion.ingest:main"
cip-eval = "cip.eval_runner:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
